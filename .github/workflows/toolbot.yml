# Toolbot: keeps the tools under tools/ up to date with pull requests.
#
#   pull requests touching tools/   → toolbot validate + verify
#   schedule / manual run           → toolbot check (opens pull requests)
#
# Secret TOOLBOT_GITHUB_TOKEN: a fine-grained personal access token for this
# repository with Contents, Pull requests and Issues: read & write. (Pull
# requests opened with the built-in GITHUB_TOKEN would not trigger the verify
# job below.)
name: Toolbot

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Report only, change nothing
        type: boolean
        default: false
  pull_request:
    paths: ["tools/**", ".terraform-version"]

permissions:
  contents: read

concurrency:
  group: toolbot
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true # large tools (helm) are stored with Git LFS
      - uses: CharlieWoo01/toolbot@56b204fd9e69ac70ddab5089b346c876ef85901b # main
        with:
          args: validate
      - uses: CharlieWoo01/toolbot@56b204fd9e69ac70ddab5089b346c876ef85901b # main
        with:
          args: verify

  check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: CharlieWoo01/toolbot@56b204fd9e69ac70ddab5089b346c876ef85901b # main
        with:
          args: ${{ inputs.dry-run && 'check --dry-run' || 'check' }}
        env:
          # This repository is the target (detected from GITHUB_REPOSITORY).
          TOOLBOT_GITHUB_TOKEN: ${{ secrets.TOOLBOT_GITHUB_TOKEN }}
